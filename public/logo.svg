<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Paper Tone -->
  <rect width="512" height="512" fill="#f5efe3" rx="96"/>
  
  <!-- Subtle inner border resembling Porcha/Khatian ledger margin -->
  <rect x="28" y="28" width="456" height="456" rx="72" fill="none" stroke="#d6cab4" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Main Dag Plot Outline with Branching Family Tree (Bongsho) Top Edge -->
  <g fill="none" stroke="#1e2229" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dag Boundary (Irregular quadrilateral base representing a survey plot) -->
    <!-- Bottom left: (116, 380), Bottom right: (396, 380), Up right: (376, 210), Up left: (136, 230) -->
    <path d="M 136 230 L 116 380 L 396 380 L 376 210" />
    
    <!-- Top branching lineage (Bongsho tree nodes originating from the plot) -->
    <!-- Left top edge to root node -->
    <path d="M 136 230 L 256 220" />
    <path d="M 256 220 L 376 210" />
    
    <!-- Vertical genealogical stem from plot -->
    <path d="M 256 220 L 256 145" />
    
    <!-- Branching limbs -->
    <path d="M 256 165 L 186 110" />
    <path d="M 256 165 L 326 110" />
    <path d="M 256 145 L 256 95" />
  </g>

  <!-- Lineage Tree Leaf/Plot Nodes -->
  <g fill="#25386b">
    <circle cx="186" cy="110" r="14" />
    <circle cx="326" cy="110" r="14" />
    <circle cx="256" cy="95" r="16" />
    <circle cx="256" cy="220" r="10" />
  </g>

  <!-- Plot Survey Corner Pegs -->
  <g fill="#6b4e2e">
    <circle cx="116" cy="380" r="10" />
    <circle cx="396" cy="380" r="10" />
    <circle cx="136" cy="230" r="10" />
    <circle cx="376" cy="210" r="10" />
  </g>

  <!-- Center Dag Survey Stamp Text -->
  <text x="256" y="325" text-anchor="middle" font-family="'Noto Serif Bengali', 'Hind Siliguri', serif" font-size="52" font-weight="bold" fill="#1e2229" letter-spacing="2">
    জমি বংশ
  </text>
</svg>
